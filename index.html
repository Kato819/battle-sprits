<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>バトスピ シミュレーター</title>
    <link rel="stylesheet" href="card.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 通信接続バー -->
    <div id="network-bar" style="background: #0f172a; padding: 10px; border-bottom: 2px solid #334155; display: flex; gap: 12px; align-items: center; font-size: 14px;">
        <div>
            あなたのID: <strong id="my-peer-id" style="color: #38bdf8;">接続中...</strong>
        </div>
        <input type="text" id="target-peer-id" placeholder="相手のIDを入力" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #64748b; background: #1e293b; color: white;">
        <button type="button" id="connect-btn" style="padding: 4px 12px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">接続</button>
        <span id="connection-status" style="color: #94a3b8;">未接続</span>
    </div>
    <!-- 1. ゲーム盤面（お互いに共有・見える場所） -->
    <div id="board">
        <!-- 相手のフィールドエリア（反転表示） -->
        <div id="op-hand"></div>
        <div id="opponent-field">
            <div class="card-area">
                <!-- 1段目（上段）：左端バースト 〜 右端デッキ -->
                <div class="single-card-area" id="op-burst-slot">バースト</div>
                <div class="single-card-area" data-op-slot="1"></div>
                <div class="single-card-area" data-op-slot="2"></div>
                <div class="single-card-area" data-op-slot="3"></div>
                <div class="single-card-area" data-op-slot="4"></div>
                <div class="single-card-area" data-op-slot="5"></div>
                <!-- 右上：デッキ -->
                <div class="single-card-area" id="op-deck-slot"></div>

                <!-- 2段目（下段）：〜 右端トラッシュ -->
                <div style="visibility: hidden; width: 74px;"></div>
                <div class="single-card-area" data-op-slot="6"></div>
                <div class="single-card-area" data-op-slot="7"></div>
                <div class="single-card-area" data-op-slot="8"></div>
                <div class="single-card-area" data-op-slot="9"></div>
                <div class="single-card-area" data-op-slot="10"></div>
                <!-- 右下：トラッシュ -->
                <div class="single-card-area trash-area" id="op-trash-slot">
                    <span class="trash-text">トラッシュ</span>
                </div>
            </div>

            <!-- コアエリアも自分の場と全く同じ並び（左がライフ、右がトラッシュ） -->
            <div class="core-area">
                <div class="left-core">
                    <div class="life-cores">
                        <div class="life-core" id="op-life1"></div>
                        <div class="life-core" id="op-life2"></div>
                        <div class="life-core" id="op-life3"></div>
                        <div class="life-core" id="op-life4"></div>
                        <div class="life-core" id="op-life5"></div>
                        <div class="life-core is-transparent" id="op-life6"></div>
                    </div>
                    <div class="reserve-core">
                        <div class="core-display">
                            <div class="core"></div>
                            <span class="core-cross">×</span>
                            <span class="core-num" id="op-reserve-count">4</span>
                        </div>
                    </div>
                </div>
                <div class="right-core">
                    <div class="trash-core">
                        <div class="core-display">
                            <div class="core"></div>
                            <span class="core-cross">×</span>
                            <span class="core-num" id="op-trash-count">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- 自分のフィールドエリア -->
        <div id="my-field">
            <!-- 自分のフィールドの card-area 内（例） -->
            <div class="card-area">
                <!-- 1段目：左端バースト 〜 右端デッキ -->
                <div class="single-card-area" id="burst-slot">バースト</div>
                <div class="single-card-area" data-my-slot="1"></div>
                <div class="single-card-area" data-my-slot="2"></div>
                <div class="single-card-area" data-my-slot="3"></div>
                <div class="single-card-area" data-my-slot="4"></div>
                <div class="single-card-area" data-my-slot="5"></div>
                <div class="single-card-area" id="deck-slot"></div>

                <!-- 2段目：8 〜 15 〜 右端トラッシュ -->
                <div style="visibility: hidden; width: 74px;"></div>
                <div class="single-card-area" data-my-slot="6"></div>
                <div class="single-card-area" data-my-slot="7"></div>
                <div class="single-card-area" data-my-slot="8"></div>
                <div class="single-card-area" data-my-slot="9"></div>
                <div class="single-card-area" data-my-slot="10"></div>
                <div class="single-card-area trash-area" id="trash-slot">
                    <span class="trash-text">トラッシュ</span>
                </div>
            </div>

            <div class="core-area">
                <div class="left-core">
                    <div class="life-cores">
                        <div class="life-core" id="life1"></div>
                        <div class="life-core" id="life2"></div>
                        <div class="life-core" id="life3"></div>
                        <div class="life-core" id="life4"></div>
                        <div class="life-core" id="life5"></div>
                        <div class="life-core is-transparent" id="life6"></div>
                    </div>
                    <!-- リザーブコア（初期値: 4個） -->
                    <div class="reserve-core">
                        <button type="button" class="core-btn btn-minus" data-target="reserve">−</button>
                        <div class="core-display">
                            <div class="core"></div>
                            <span class="core-cross">×</span>
                            <span class="core-num" id="reserve-count">4</span>
                        </div>
                        <button type="button" class="core-btn btn-plus" data-target="reserve">＋</button>
                    </div>
                </div>
                <div class="right-core">
                    <!-- トラッシュコア（初期値: 0個） -->
                    <div class="trash-core">
                        <button type="button" class="core-btn btn-minus" data-target="trash">−</button>
                        <div class="core-display">
                            <div class="core"></div>
                            <span class="core-cross">×</span>
                            <span class="core-num" id="trash-count">0</span>
                        </div>
                        <button type="button" class="core-btn btn-plus" data-target="trash">＋</button>
                    </div>
                    <!-- 自陣の right-core の中（リフレッシュボタンの上） -->
                    <button type="button" id="core-step-btn" style="width: 100%; padding: 4px; background: #0284c7; color: white; border: none; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; margin-bottom: 4px;">コア+1</button>
                    <button type="button" id="refresh-btn">リフレッシュ</button>
                    
                </div>
            </div>
        </div>

        <!-- 手札エリア -->
        <div id="my-hand">
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>
            <div class="single-card-area"></div>

        </div>

    </div>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="card-list.js"></script>
    <script src="deck1.js"></script>
    <script src="network.js"></script> <!-- ★追加 -->
    <script src="main.js"></script>
</body>
</html>
